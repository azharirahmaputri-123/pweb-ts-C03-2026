<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - Antrian Rumah Sakit</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="app-header">
        <!-- ZONA KIRI: Identitas & Judul Halaman -->
        <div class="header-brand-zone">
            <div class="brand-logo-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 6v12M6 12h12"/>
                </svg>
            </div>
            <div class="header-titles">
                <span class="header-app-name">RS Medika Antrian</span>
                <h1 class="header-page-title">Dashboard Admin</h1>
            </div>
        </div>

        <!-- ZONA TENGAH: Segmented Navigasi Staf -->
        <nav class="header-segmented-nav" aria-label="Navigasi Panel Staf">
            <a href="index.html" class="nav-tab-item active">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="7"/>
                    <rect x="14" y="3" width="7" height="7"/>
                    <rect x="14" y="14" width="7" height="7"/>
                    <rect x="3" y="14" width="7" height="7"/>
                </svg>
                <span>Dashboard</span>
            </a>
            <a href="operator.html" class="nav-tab-item">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                    <circle cx="9" cy="7" r="4"/>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                </svg>
                <span>Operator</span>
            </a>
            <a href="layar.html" target="_blank" class="nav-tab-item" title="Buka Layar Monitor Antrian di Tab Baru">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="3" width="20" height="14" rx="2"/>
                    <line x1="8" y1="21" x2="16" y2="21"/>
                </svg>
                <span>Layar</span>
            </a>
            <a href="ambil-antrian.html" target="_blank" class="nav-tab-item" title="Buka Kiosk Tiket di Tab Baru">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="4" width="20" height="16" rx="2"/>
                </svg>
                <span>Kiosk</span>
            </a>
        </nav>

        <!-- ZONA KANAN: Profil Admin & Logout -->
        <div class="header-actions-zone">
            <div class="user-profile-chip">
                <div class="user-avatar" id="user-avatar-initial">A</div>
                <div class="user-details">
                    <strong class="user-name-text" id="admin-name">Admin</strong>
                    <span class="user-role-badge" id="admin-role">ADMIN</span>
                </div>
            </div>

            <button id="logout-btn" type="button" class="btn-header-logout" title="Keluar dari sesi akun">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
                <span>Keluar</span>
            </button>
        </div>
    </header>

    <main class="admin-grid">
        <!-- Bagian 1: Manajemen Jenis Antrian (CRUD) -->
        <section id="jenis-antrian-section">
            <h3>Manajemen Layanan (CRUD)</h3>
            <form id="layanan-form">
                <div class="admin-form-row">
                    <div>
                        <label for="kode-layanan">Kode (A-Z)</label>
                        <input type="text" id="kode-layanan" maxlength="1" placeholder="C" style="text-transform: uppercase; text-align: center; font-weight: 700;" required>
                    </div>
                    <div>
                        <label for="nama-layanan">Nama Layanan</label>
                        <input type="text" id="nama-layanan" placeholder="Contoh: Poli Gigi" required>
                    </div>
                </div>
                <button type="submit" id="save-layanan-btn" style="width: 100%;">+ Tambah Layanan</button>
            </form>

            <div style="margin-top: 1.75rem; flex: 1; display: flex; flex-direction: column;">
                <h4>Daftar Layanan</h4>
                <div id="list-layanan-container" style="margin-top: 0.5rem; display: flex; flex-direction: column; gap: 0.5rem; max-height: 280px; overflow-y: auto;">
                    <!-- Render list via TypeScript -->
                </div>
            </div>
            
            <div style="margin-top: 1.5rem; border-top: 1px dashed var(--card-border); padding-top: 1rem;">
                <button type="button" id="reset-all-btn">Reset Seluruh Antrian</button>
            </div>
        </section>

        <!-- Bagian 2: Terbitkan Tiket Manual & Monitoring Singkat -->
        <section id="terbitkan-tiket-section">
            <h3>Terbitkan Tiket Manual</h3>
            <form id="tiket-manual-form">
                <div>
                    <label for="select-layanan">Pilih Layanan</label>
                    <select id="select-layanan" required>
                        <option value="">-- Pilih Layanan --</option>
                    </select>
                </div>
                <div>
                    <label for="select-prioritas">Prioritas</label>
                    <select id="select-prioritas" required>
                        <option value="Normal">Normal</option>
                        <option value="Lansia">Lansia</option>
                        <option value="Disabilitas">Disabilitas</option>
                        <option value="VIP">VIP</option>
                    </select>
                </div>
                <button type="submit" id="terbitkan-btn" style="width: 100%;">Terbitkan Tiket</button>
            </form>

            <div style="margin-top: 1.75rem; flex: 1; display: flex; flex-direction: column;">
                <h4>Daftar Tiket Aktif (10 Terakhir)</h4>
                <div id="list-tiket-container" style="max-height: 280px; overflow-y: auto; margin-top: 0.5rem; display: flex; flex-direction: column; gap: 0.5rem;">
                    <!-- Render tiket via TypeScript -->
                </div>
            </div>
        </section>
    </main>

    <script src="js/queue.js" defer></script>
    <script src="js/admin.js" defer></script>
</body>
</html>
