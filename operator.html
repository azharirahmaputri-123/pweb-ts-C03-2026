<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Operator - Antrian Rumah Sakit</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="app-header">
        <!-- ZONA KIRI: Identitas & Judul Halaman -->
        <div class="header-brand-zone">
            <div class="brand-logo-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 6v12M6 12h12"/>
                </svg>
            </div>
            <div class="header-titles">
                <span class="header-app-name">RS Medika Antrian</span>
                <h1 class="header-page-title">Panel Operator</h1>
            </div>
        </div>

        <!-- ZONA TENGAH: Segmented Navigasi Staf -->
        <nav class="header-segmented-nav" aria-label="Navigasi Panel Staf">
            <a href="index.html" class="nav-tab-item">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="7"/>
                    <rect x="14" y="3" width="7" height="7"/>
                    <rect x="14" y="14" width="7" height="7"/>
                    <rect x="3" y="14" width="7" height="7"/>
                </svg>
                <span>Dashboard</span>
            </a>
            <a href="operator.html" class="nav-tab-item active">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                    <circle cx="9" cy="7" r="4"/>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                </svg>
                <span>Operator</span>
            </a>
            <a href="layar.html" target="_blank" class="nav-tab-item" title="Buka Layar Monitor Antrian di Tab Baru">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="3" width="20" height="14" rx="2"/>
                    <line x1="8" y1="21" x2="16" y2="21"/>
                </svg>
                <span>Layar</span>
            </a>
            <a href="ambil-antrian.html" target="_blank" class="nav-tab-item" title="Buka Kiosk Tiket di Tab Baru">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="4" width="20" height="16" rx="2"/>
                </svg>
                <span>Kiosk</span>
            </a>
        </nav>

        <!-- ZONA KANAN: Kontrol Suara, Profil & Logout -->
        <div class="header-actions-zone">
            <button id="suara-btn" type="button" class="btn-tool-sound" aria-pressed="true" title="Toggle Panggilan Suara TTS">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
                </svg>
                <span id="suara-label">Suara: Aktif</span>
            </button>

            <div class="header-divider"></div>

            <div class="user-profile-chip">
                <div class="user-avatar" id="user-avatar-initial">O</div>
                <div class="user-details">
                    <strong class="user-name-text" id="operator-name">Operator</strong>
                    <span class="user-role-badge" id="operator-role">ADMIN</span>
                </div>
            </div>

            <button id="logout-btn" type="button" class="btn-header-logout" title="Keluar dari sesi akun">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
                <span>Keluar</span>
            </button>
        </div>
    </header>

    <main id="operator-panels-container">
        <!-- Kartu Operator per Layanan -->
    </main>

    <script src="js/queue.js" defer></script>
    <script src="js/operator.js" defer></script>
</body>
</html>
