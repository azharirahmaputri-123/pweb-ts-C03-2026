<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Antrian Rumah Sakit</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="login-container">
        <h1>Masuk</h1>
        <form id="login-form">
            <label for="username">Username</label>
            <input type="text" id="username" required autocomplete="username">

            <label for="password">Password</label>
            <div style="position: relative; display: flex; align-items: center;">
                <input type="password" id="password" placeholder="Contoh: emilyspass" required autocomplete="current-password" style="margin-bottom: 1rem; padding-right: 2.5rem;">
                <button type="button" id="toggle-password-btn" style="position: absolute; right: 10px; top: 35%; transform: translateY(-50%); background: transparent; border: none; cursor: pointer; font-size: 1rem; color: var(--text-dark); padding: 0;">👁️</button>
            </div>
            <button type="submit" id="login-btn">Masuk</button>
        </form>
        <p id="error-message" class="error"></p>
    </main>

    <!-- Script JS disesuaikan ke folder js/ -->
    <script src="js/login.js" defer></script>
</body>
</html>
